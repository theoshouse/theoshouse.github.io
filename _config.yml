# ------------------------------------------------------------
# SITE SETTINGS
# Change the text after each colon. Keep the quotation marks.
# After you save this file, wait 1-2 minutes for the site to update.
# ------------------------------------------------------------

title: ""
description: "A short line about you, shown in search engine results."
email: "theodore.shouse@mail.mcgill.ca"

# Your Substack address, used by the subscribe links.
substack_url: "https://theoshouse.substack.com"

# Links shown at the bottom of every page. Delete any line you don't want.
links:
  - name: "LinkedIn"
    url: "https://www.linkedin.com/in/theodore-shouse-a39133a7/"
  - name: "Substack"
    url: "https://theoshouse.substack.com"

# The menu at the top of every page.
# To add a page to the menu, add two lines like the ones below.
navigation:
  - name: "About"
    url: "/"
  - name: "CV"
    url: "/cv/"
  - name: "Blog"
    url: "/blog/"
  - name: "Podcasts"
    url: "/podcasts/"

# ------------------------------------------------------------
# TECHNICAL SETTINGS: you shouldn't need to change anything below.
# ------------------------------------------------------------
markdown: kramdown
permalink: /blog/:year/:month/:title/
timezone: America/Toronto

# Podcast episodes live in the _podcasts folder and are listed on the Podcasts page.
collections:
  podcasts:
    output: false

exclude:
  - HOW-TO-EDIT.md
  - CLAUDE.md
  - README.md

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
