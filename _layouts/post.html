---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  {{ content }}
  {% if page.also_on %}
  <p class="also-on">Also published on
    {% for place in page.also_on %}<a href="{{ place.url }}">{{ place.name }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}.
  </p>
  {% endif %}
  <p class="back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</article>
