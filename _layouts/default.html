<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      {% for item in site.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="current"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    {% if page.photo %}<img class="profile-photo" src="{{ page.photo | relative_url }}" alt="Photo of {{ site.title }}">{% endif %}
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      {% if site.email %}<a href="mailto:{{ site.email }}">{{ site.email }}</a>{% endif %}
      {% for link in site.links %} · <a href="{{ link.url }}">{{ link.name }}</a>{% endfor %}
    </p>
    <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </footer>
</body>
</html>
