# Keeps the Substack posts on the website up to date.
# It runs by itself every six hours. To run it right away, open the
# Actions tab on GitHub, click "Update Substack posts", then "Run workflow".
name: Update Substack posts

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - _config.yml
      - .github/workflows/substack.yml
      - .github/scripts/fetch_substack.py

permissions:
  contents: write

concurrency:
  group: substack
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the latest posts
        run: python .github/scripts/fetch_substack.py

      - name: Save them if anything changed
        run: |
          if git diff --quiet -- _data/substack.json; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/substack.json
          git commit -m "Update Substack posts"
          git push
